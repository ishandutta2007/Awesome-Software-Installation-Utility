<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Orbs / Animated Background Elements -->
  <circle cx="150" cy="80" r="120" fill="url(#glow)">
    <animate attributeName="r" values="100;140;100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="220" r="150" fill="url(#glow)">
    <animate attributeName="r" values="130;170;130" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250"/>
    <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300 M 800 0 L 800 300 M 900 0 L 900 300 M 1000 0 L 1000 300 M 1100 0 L 1100 300"/>
  </g>

  <!-- Dynamic / Animated Particles & Package Floating Icons in Background -->
  <g opacity="0.4">
    <!-- Floating Box 1 -->
    <rect x="100" y="180" width="40" height="40" rx="6" fill="none" stroke="#6366f1" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Floating Box 2 -->
    <rect x="1040" y="60" width="50" height="50" rx="8" fill="none" stroke="#ec4899" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,15; 0,0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- Dynamic Pulsing Ring -->
    <circle cx="950" cy="130" r="30" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0 950 130" to="360 950 130" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Main Title & Subtitle (Guaranteed Unobscured) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Category Pill Badge -->
    <rect x="450" y="40" width="300" height="32" rx="16" fill="url(#accent-grad)" opacity="0.9"/>
    <text x="600" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="2">
      PACKAGING &amp; DEPLOYMENT ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Software Installation Utility
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1">
      Curated Guide to Commercial Installers, Package Builders &amp; Deployment Automation
    </text>

    <!-- Stat Pills / Badges -->
    <g transform="translate(390, 225)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">📦 20+ Utilities</text>

      <rect x="145" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="210" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c084fc">⚡ Open Source</text>

      <rect x="290" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="355" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f472b6">🚀 Enterprise SaaS</text>
    </g>
  </g>
</svg>
